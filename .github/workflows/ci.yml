name: Vérifications

on:
  push:
  pull_request:

jobs:
  donnees:
    name: Données du cahier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Valider fiches, exercices et réponses modèles
        run: node tools/validate.mjs

  scripts:
    name: Scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installer shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: >
          shellcheck -x -P SCRIPTDIR -e SC2016,SC1112
          infra/bin/lab infra/proxmox/*.sh labs/lib/*.sh labs/lab*/*.sh tools/*.sh
          labs/lab01-premier-jour/fichiers/thermostat-cuve labs/lab01-premier-jour/fichiers/sauvegarde-recettes
          labs/lab03-demarrage/fichiers/brassd labs/lab03-demarrage/fichiers/collecte-capteurs
          labs/lab04-services/fichiers/vitrine labs/lab04-services/fichiers/inventaire labs/lab04-services/fichiers/export-ventes
          labs/lab05-comptes/fichiers/ecrit-commandes labs/lab05-comptes/fichiers/synchro-perso
          labs/lab06-performances/fichiers/calcul-stocks labs/lab06-performances/fichiers/sauvegarde-nuit
          labs/lab06-performances/fichiers/journal-capteurs

  lab01:
    name: Lab 01 de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup, correction, solution, correction, reset
        run: sudo bash tools/tester-lab01.sh

  lab02:
    name: Lab 02 de bout en bout (disques loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Outils LVM et XFS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lvm2 xfsprogs
      - name: Setup, correction, solution, correction, reset
        run: sudo bash tools/tester-lab02.sh

  lab03:
    name: Lab 03 (partiel, sans redémarrage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Panne, réparation, correction, reset
        run: sudo bash tools/tester-lab03.sh

  lab04:
    name: Lab 04 de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup, correction, solution, correction, reset
        run: sudo bash tools/tester-lab04.sh

  lab05:
    name: Lab 05 de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup, correction, solution, correction, reset
        run: sudo bash tools/tester-lab05.sh

  lab06:
    name: Lab 06 de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup, correction, diagnostic, correction, reset
        run: sudo bash tools/tester-lab06.sh

  lab07:
    name: Lab 07 (trois machines simulées par des espaces de noms réseau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: douane (la machine de test), comptoir et cuve (espaces de noms)
        run: sudo bash tools/tester-lab07.sh

  lab08:
    name: Lab 08 (cuve, comptoir et douane joués tour à tour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trois rôles sur la même machine
        run: sudo bash tools/tester-lab08.sh
