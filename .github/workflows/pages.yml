name: Publier le cahier sur GitHub Pages

# Activation (une seule fois) : Settings > Pages > Source : « GitHub Actions ».
# GitHub Pages est gratuit pour les dépôts publics. Pour un dépôt privé avec un compte payant,
# crée la variable de dépôt PAGES_ACTIF = true (Settings > Secrets and variables > Actions > Variables).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    if: ${{ !github.event.repository.private || vars.PAGES_ACTIF == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Valider les données avant publication
        run: node tools/validate.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
